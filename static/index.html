<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mood Reader</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫧</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15132a; --text:#f3f1fb; --muted:#a29fbd; --line:rgba(255,255,255,.1);
  --rgb:150,140,200;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{background:var(--ink)}
body{
  min-height:100vh;font:400 17px/1.55 var(--body);color:var(--text);
  background:
    radial-gradient(60vmax 50vmax at 80% -10%,rgba(var(--rgb),.28),transparent 60%),
    radial-gradient(50vmax 40vmax at 0% 110%,rgba(var(--rgb),.16),transparent 60%),
    var(--ink);
  overflow-x:hidden;
}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:clamp(28px,7vh,72px) 22px 64px}

.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:clamp(36px,8vh,80px);font-weight:600}
.brand{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.status{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:#e0b04a;box-shadow:0 0 0 0 currentColor;animation:ping 1.8s infinite;color:#e0b04a}
.status.ok .dot{background:#4fd18b;color:#4fd18b}
.status.bad .dot{background:#ff6b6b;color:#ff6b6b;animation:none}
@keyframes ping{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}

h1{font:800 clamp(40px,8.4vw,76px)/.98 var(--display);letter-spacing:-.035em;margin-bottom:18px}
h1 span{display:block;overflow:hidden}
h1 span i{display:block;font-style:normal;transform:translateY(105%);animation:rise .9s cubic-bezier(.2,.9,.2,1) forwards}
h1 span:nth-child(2) i{animation-delay:.12s}
@keyframes rise{to{transform:none}}
.lede{color:var(--muted);max-width:46ch;margin-bottom:36px}

.field{position:relative}
textarea{
  width:100%;min-height:132px;resize:none;border:0;outline:0;background:transparent;
  color:var(--text);font:500 clamp(22px,3.6vw,30px)/1.3 var(--display);letter-spacing:-.015em;
  padding:6px 0 18px;caret-color:rgb(var(--rgb));
}
textarea::placeholder{color:rgba(243,241,251,.28)}
.rule{height:2px;background:var(--line);position:relative;overflow:hidden;border-radius:2px}
.rule::after{content:"";position:absolute;inset:0;background:rgb(var(--rgb));transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.9,.2,1)}
.field:focus-within .rule::after{transform:scaleX(1)}
.rule.loading::after{transform:none;width:35%;animation:scan 1s ease-in-out infinite}
@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(300%)}}

.row{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;margin-top:20px}
button{font:inherit;cursor:pointer;color:inherit}
.go{
  border:0;border-radius:999px;padding:13px 26px;font-weight:600;color:#15132a;
  background:rgb(var(--rgb));transition:transform .2s,box-shadow .3s,background .6s,opacity .2s;
  box-shadow:0 8px 30px -8px rgba(var(--rgb),.7);
}
.go:hover{transform:translateY(-2px)}
.go:active{transform:scale(.97)}
.go:disabled{opacity:.45;cursor:not-allowed;transform:none}
.live{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted);cursor:pointer;user-select:none}
.live input{position:absolute;opacity:0}
.sw{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;transition:background .3s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.live input:checked + .sw{background:rgb(var(--rgb))}
.live input:checked + .sw::after{transform:translateX(16px)}
.count{margin-left:auto;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid rgb(var(--rgb));outline-offset:3px;border-radius:8px}

.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.chip{
  border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:999px;
  padding:8px 15px;font-size:15px;color:var(--muted);transition:all .25s;
}
.chip:hover{color:var(--text);border-color:rgba(var(--rgb),.7);background:rgba(var(--rgb),.12)}

.err{margin-top:22px;padding:14px 18px;border-radius:14px;background:rgba(255,90,90,.12);border:1px solid rgba(255,90,90,.35);font-size:15px}
[hidden]{display:none!important}

.result{
  margin-top:44px;border-radius:28px;padding:clamp(22px,4vw,36px);
  background:rgba(255,255,255,.045);border:1px solid var(--line);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  display:grid;grid-template-columns:auto 1fr;gap:28px 36px;align-items:center;
}
.result.in{animation:card .7s cubic-bezier(.2,.9,.2,1)}
@keyframes card{from{opacity:0;transform:translateY(26px) scale(.97)}}
.hero{position:relative;width:150px;height:150px;display:grid;place-items:center}
.hero svg{position:absolute;inset:0;transform:rotate(-90deg)}
.hero circle{fill:none;stroke-width:5;stroke-linecap:round}
.hero .tr{stroke:var(--line)}
.hero .pr{stroke:rgb(var(--rgb));stroke-dasharray:276.46;stroke-dashoffset:276.46;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.9,.2,1)}
.emoji{font-size:64px;line-height:1;display:block;transform-origin:50% 80%}
.emoji.joy{animation:joy .9s cubic-bezier(.3,1.6,.5,1)}
.emoji.sadness{animation:sad 1.4s ease-out forwards}
.emoji.anger{animation:anger .6s linear}
.emoji.fear{animation:fear .8s linear}
.emoji.love{animation:love 1.1s ease-in-out}
.emoji.surprise{animation:pop .7s cubic-bezier(.3,1.9,.5,1)}
@keyframes joy{0%{transform:translateY(30px) scale(.4)}45%{transform:translateY(-22px) scale(1.15)}70%{transform:translateY(0)}85%{transform:translateY(-7px)}100%{transform:none}}
@keyframes sad{0%{transform:translateY(-14px) scale(1.1);opacity:0}100%{transform:none;opacity:1}}
@keyframes anger{0%,100%{transform:none}15%{transform:translateX(-7px) rotate(-5deg)}35%{transform:translateX(7px) rotate(5deg)}55%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes fear{0%,100%{transform:none}10%{transform:translate(-2px,1px)}20%{transform:translate(2px,-1px)}30%{transform:translate(-2px,-2px)}40%{transform:translate(2px,2px)}50%{transform:translate(-1px,1px)}60%{transform:translate(2px,0)}70%{transform:translate(-2px,1px)}80%{transform:translate(1px,-2px)}}
@keyframes love{0%{transform:scale(.5)}25%{transform:scale(1.25)}40%{transform:scale(.95)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes pop{0%{transform:scale(0) rotate(-25deg)}100%{transform:none}}

.verdict h2{font:800 clamp(34px,6vw,52px)/1 var(--display);letter-spacing:-.03em;text-transform:capitalize}
.verdict p{color:var(--muted);margin-top:8px}
.verdict b{color:var(--text);font-variant-numeric:tabular-nums}

.bars{grid-column:1/-1;display:grid;gap:12px;padding-top:6px}
.bar{display:grid;grid-template-columns:30px 88px 1fr 52px;align-items:center;gap:10px;font-size:15px;color:var(--muted);transition:color .4s}
.bar.top{color:var(--text);font-weight:600}
.bar .t{height:8px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden}
.bar .f{height:100%;width:0;border-radius:8px;background:var(--c);transition:width 1s cubic-bezier(.2,.9,.2,1);opacity:.55}
.bar.top .f{opacity:1;box-shadow:0 0 16px var(--c)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
.bar .n{text-transform:capitalize}

.hist{margin-top:34px}
.hist h3{font:600 15px var(--body);color:var(--muted);margin-bottom:10px}
.hist ul{list-style:none;padding:0;display:grid;gap:4px}
.hist button{
  width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:10px 12px;
  display:flex;gap:12px;align-items:center;color:var(--muted);transition:background .2s,color .2s;
}
.hist button:hover{background:rgba(255,255,255,.05);color:var(--text)}
.hist span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist li{animation:card .5s cubic-bezier(.2,.9,.2,1)}

@media(max-width:560px){
  .result{grid-template-columns:1fr;justify-items:start}
  .hero{width:120px;height:120px}.emoji{font-size:52px}
  .bar{grid-template-columns:26px 74px 1fr 46px}
  .count{margin-left:0}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
  h1 span i{transform:none}
}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main>
  <div class="top">
    <div class="brand">Mood Reader</div>
    <div class="status" id="status" role="status"><i class="dot"></i><span>Waking up the model…</span></div>
  </div>

  <h1><span><i>How does this</i></span><span><i>sentence feel?</i></span></h1>
  <p class="lede">Write anything. A BiGRU model reads it and tells you which of six emotions it carries.</p>

  <div class="field">
    <textarea id="text" maxlength="2000" rows="3" placeholder="Type how your day went…" aria-label="Text to analyze" autofocus></textarea>
    <div class="rule" id="rule"></div>
  </div>

  <div class="row">
    <button class="go" id="go" disabled>Read the mood</button>
    <label class="live"><input type="checkbox" id="live"><span class="sw"></span>Update as I type</label>
    <span class="count" id="count">0 / 2000</span>
  </div>

  <div class="chips" id="chips"></div>
  <div class="err" id="err" role="alert" hidden></div>

  <section class="result" id="result" hidden aria-live="polite">
    <div class="hero">
      <svg viewBox="0 0 100 100"><circle class="tr" cx="50" cy="50" r="44"/><circle class="pr" id="ring" cx="50" cy="50" r="44"/></svg>
      <span class="emoji" id="emoji"></span>
    </div>
    <div class="verdict">
      <h2 id="label"></h2>
      <p><b id="conf">0%</b> confident</p>
    </div>
    <div class="bars" id="bars"></div>
  </section>

  <section class="hist" id="hist" hidden>
    <h3>Recent readings</h3>
    <ul id="histList"></ul>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const EMO = {
    sadness:  {rgb:[96,148,245],  e:'😢', p:{g: .35, s:.20, j:.04, p:.00}},
    joy:      {rgb:[255,200,61],  e:'😄', p:{g:-.30, s:.95, j:.18, p:.20}},
    love:     {rgb:[255,98,150],  e:'❤️', p:{g:-.20, s:.35, j:.03, p:.55}},
    anger:    {rgb:[255,77,61],   e:'😠', p:{g: .00, s:1.1, j:.95, p:.65}},
    fear:     {rgb:[160,116,255], e:'😨', p:{g: .00, s:.40, j:1.7, p:.30}},
    surprise: {rgb:[47,212,192],  e:'😲', p:{g: .00, s:.60, j:.10, p:.10}},
  };
  const NEUTRAL = {rgb:[150,140,200], p:{g:0, s:.25, j:.05, p:0}};
  const ORDER = ['sadness','joy','love','anger','fear','surprise'];
  const EXAMPLES = [
    "I finally got the job and I can’t stop smiling",
    "Nobody came to the party and the house feels so empty",
    "How dare you take credit for my work",
    "Someone is following me and I’m too scared to look back",
    "You are the best thing that ever happened to me",
    "I opened the box and there was a puppy inside"
  ];

  /* ---------- Background: mood-reactive particles ---------- */
  const cv = $('bg'), ctx = cv.getContext('2d');
  let W, H, dpr, parts = [], mouse = {x:-999, y:-999};
  let col = NEUTRAL.rgb.slice(), colT = NEUTRAL.rgb.slice();
  let par = {...NEUTRAL.p}, parT = {...NEUTRAL.p};

  function resize(){
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.round(Math.min(90, Math.max(36, W*H/16000)));
    while (parts.length < n) parts.push({x:Math.random()*W, y:Math.random()*H, vx:0, vy:0, r:8+Math.random()*34, ph:Math.random()*6.28});
    parts.length = n;
  }
  addEventListener('resize', resize); resize();
  addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  addEventListener('pointerleave', () => { mouse.x = mouse.y = -999; });

  function burst(cx, cy, force){
    if (reduce) return;
    for (const p of parts){
      const dx = p.x-cx, dy = p.y-cy, d = Math.hypot(dx,dy) || 1;
      const k = force * Math.min(1, 500/d) / (1 + p.r/30);
      p.vx += dx/d*k; p.vy += dy/d*k;
    }
  }

  let lastRgb = '';
  function frame(t){
    for (let i=0;i<3;i++) col[i] += (colT[i]-col[i])*.04;
    for (const k in par) par[k] += (parT[k]-par[k])*.04;
    const rgb = col.map(Math.round).join(',');
    if (rgb !== lastRgb){ document.documentElement.style.setProperty('--rgb', rgb); lastRgb = rgb; }

    const sp = reduce ? .2 : 1;
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation = 'lighter';
    for (const p of parts){
      p.vx += (Math.random()-.5)*par.j*.25*sp + Math.cos(t*.0004+p.ph)*par.s*.012*sp;
      p.vy += (Math.random()-.5)*par.j*.25*sp + Math.sin(t*.0005+p.ph)*par.s*.012*sp + par.g*.025*sp;
      const dx = p.x-mouse.x, dy = p.y-mouse.y, d2 = dx*dx+dy*dy;
      if (d2 < 22500){ const d = Math.sqrt(d2)||1, f=(1-d/150)*.9; p.vx += dx/d*f; p.vy += dy/d*f; }
      p.vx *= .965; p.vy *= .965;
      p.x += p.vx; p.y += p.vy;
      if (p.x < -60) p.x = W+60; if (p.x > W+60) p.x = -60;
      if (p.y < -60) p.y = H+60; if (p.y > H+60) p.y = -60;
      const pulse = 1 + par.p*Math.sin(t*.006 + p.ph*3)*.5;
      const r = p.r*pulse, a = .16 + par.p*.08;
      const g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
      g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x,p.y,r,0,6.283); ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function setMood(key){
    const m = EMO[key] || NEUTRAL;
    colT = m.rgb.slice(); parT = {...m.p};
  }

  /* ---------- UI ---------- */
  const text = $('text'), go = $('go'), rule = $('rule'), err = $('err');
  const result = $('result'), live = $('live');
  const history = [];
  let seq = 0, ctrl = null, timer = null;

  // example chips
  EXAMPLES.forEach(s => {
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button'; b.textContent = s;
    b.onclick = () => { text.value = s; sync(); analyze(); };
    $('chips').appendChild(b);
  });

  // bars
  ORDER.forEach(k => {
    const d = document.createElement('div');
    d.className = 'bar'; d.id = 'bar-'+k; d.style.setProperty('--c', `rgb(${EMO[k].rgb})`);
    d.innerHTML = `<span>${EMO[k].e}</span><span class="n">${k}</span><div class="t"><div class="f"></div></div><span class="v">0%</span>`;
    $('bars').appendChild(d);
  });

  function sync(){
    text.style.height = 'auto';
    text.style.height = Math.max(132, text.scrollHeight) + 'px';
    $('count').textContent = `${text.value.length} / 2000`;
    go.disabled = !text.value.trim();
  }

  function countUp(el, to){
    const from = parseFloat(el.dataset.v || 0), t0 = performance.now(), dur = reduce ? 1 : 1000;
    el.dataset.v = to;
    (function tick(now){
      const k = Math.min(1, (now-t0)/dur), e = 1-Math.pow(1-k,3);
      el.textContent = (from + (to-from)*e).toFixed(1) + '%';
      if (k < 1) requestAnimationFrame(tick);
    })(t0);
  }

  function show(data){
    const key = data.predicted_emotion, m = EMO[key];
    const first = result.hidden;
    result.hidden = false;
    if (first){ result.classList.remove('in'); void result.offsetWidth; result.classList.add('in'); }

    const em = $('emoji');
    em.className = 'emoji'; void em.offsetWidth;
    em.textContent = m.e; em.classList.add(key);

    $('label').textContent = key;
    countUp($('conf'), data.confidence*100);
    $('ring').style.strokeDashoffset = 276.46 * (1 - data.confidence);

    ORDER.forEach(k => {
      const v = (data.all_emotions[k] || 0) * 100, row = $('bar-'+k);
      row.classList.toggle('top', k === key);
      row.querySelector('.f').style.width = v + '%';
      row.querySelector('.v').textContent = v.toFixed(1) + '%';
    });

    setMood(key);
    const r = $('emoji').getBoundingClientRect();
    burst(r.left + r.width/2, r.top + r.height/2, key==='surprise' ? 26 : key==='anger' ? 20 : 12);
  }

  function addHistory(txt, key){
    if (history[0] && history[0].txt === txt) return;
    history.unshift({txt, key}); history.length = Math.min(history.length, 6);
    $('hist').hidden = false;
    const ul = $('histList'); ul.innerHTML = '';
    history.forEach(h => {
      const li = document.createElement('li'), b = document.createElement('button');
      b.type = 'button'; b.innerHTML = `<span style="flex:none;font-size:20px">${EMO[h.key].e}</span><span></span>`;
      b.lastChild.textContent = h.txt;
      b.onclick = () => { text.value = h.txt; sync(); analyze(); window.scrollTo({top:0, behavior:'smooth'}); };
      li.appendChild(b); ul.appendChild(li);
    });
  }

  async function analyze(){
    const value = text.value.trim();
    if (!value) return;
    const mine = ++seq;
    if (ctrl) ctrl.abort();
    ctrl = new AbortController();
    err.hidden = true; rule.classList.add('loading'); go.disabled = true;
    go.textContent = 'Reading…';
    try {
      const res = await fetch('/predict', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({text: value}), signal: ctrl.signal
      });
      if (!res.ok){
        const j = await res.json().catch(() => ({}));
        throw new Error(res.status === 503
          ? 'The model is still loading. Give it a few seconds and try again.'
          : (typeof j.detail === 'string' ? j.detail : 'Something went wrong while reading that text.'));
      }
      const data = await res.json();
      if (mine !== seq) return;
      show(data); addHistory(value, data.predicted_emotion);
    } catch (e){
      if (e.name === 'AbortError') return;
      err.textContent = e.message || 'Could not reach the server. Check your connection and try again.';
      err.hidden = false;
    } finally {
      if (mine === seq){ rule.classList.remove('loading'); go.textContent = 'Read the mood'; go.disabled = !text.value.trim(); }
    }
  }

  text.addEventListener('input', () => {
    sync();
    if (live.checked){ clearTimeout(timer); timer = setTimeout(() => text.value.trim().length > 2 && analyze(), 650); }
  });
  text.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); analyze(); } });
  go.addEventListener('click', analyze);
  sync();

  /* ---------- Health check (Render free tier sleeps) ---------- */
  const st = $('status');
  async function health(tries = 0){
    try {
      const j = await (await fetch('/health')).json();
      if (j.model_loaded){ st.className = 'status ok'; st.lastChild.textContent = 'Model ready'; return; }
    } catch (_) {}
    if (tries > 40){ st.className = 'status bad'; st.lastChild.textContent = 'Server unreachable'; return; }
    setTimeout(() => health(tries+1), 3000);
  }
  health();
})();
</script>
</body>
</html>
